name: Daily Sports Pipeline

on:
  schedule:
    # Runs daily at 6:00 AM UTC (adjust timezone as needed)
    - cron: '0 6 * * *'
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours max runtime per job
    strategy:
      matrix:
        scraper: [sports_sub1, sports_sub2]
      fail-fast: false  # Continue running other jobs even if one fails
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Sports Scraper - ${{ matrix.scraper }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python -m ${{ matrix.scraper }}.main

      - name: Clean up temp files
        if: always()
        run: |
          rm -rf ./temp_downloads
